# Use the LLD linker (from the Rust toolchain) for faster linking.
# LLD is LLVM's linker and is significantly faster than GNU ld (BFD) for
# large Rust workspaces. It is the Rust project's recommended fast linker.
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-B/home/y0usaf/.local/share/rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/x86_64-unknown-linux-gnu/bin/gcc-ld",
]
