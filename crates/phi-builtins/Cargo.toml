[package]
name = "phi-builtins"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# WS1.5: gates the builtin *extension registrations* (catalog, commands,
# overlays, skills, visual, mcp). The Python prelude stays unconditional — it
# is core, not a builtin extension. The MCP client's transport deps (tokio,
# reqwest, ...) ride the feature so the bare build stays slim.
default = ["builtins"]
builtins = ["dep:tokio", "dep:reqwest", "dep:futures", "dep:eventsource-stream"]

[dependencies]
phi-ext.workspace = true
phi-session.workspace = true
phi-tui.workspace = true
anyhow.workspace = true
directories.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
phi-repl.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
