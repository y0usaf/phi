[package]
name = "phi-session-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
directories.workspace = true
futures.workspace = true
ignore.workspace = true
mlua.workspace = true
phi-ai.workspace = true
phi-builtins = { workspace = true, default-features = false }
phi-ext.workspace = true
phi-lua.workspace = true
phi-rlm.workspace = true
phi-session.workspace = true
phi-tui = { workspace = true, features = ["markdown"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[features]
default = ["builtins"]
# Enables the builtin extension registrations (catalog, commands, skills,
# visual). Off = bare core: engine + REPL + plain TUI, prelude intact.
builtins = ["phi-builtins/builtins"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
