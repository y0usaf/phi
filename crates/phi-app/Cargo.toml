[package]
name = "phi-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "phi"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
directories.workspace = true
phi-ai.workspace = true
phi-builtins.workspace = true
phi-cli.workspace = true
phi-mux.workspace = true
phi-rlm.workspace = true
phi-harness.workspace = true
phi-session.workspace = true
phi-session-tui.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }
tikv-jemalloc-sys = { workspace = true, optional = true }

[features]
jemalloc = [
    "dep:tikv-jemallocator",
    "dep:tikv-jemalloc-ctl",
    "dep:tikv-jemalloc-sys",
]
jemalloc-prof = ["jemalloc"]
