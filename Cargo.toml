[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
httpdate = "1"
indexmap = "2"
libc = "0.2"
mlua = { version = "0.11", features = ["lua54", "vendored", "async"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.45", features = ["rt", "sync", "time", "macros", "process", "fs", "io-util", "net"] }
url = "2"
unicode-normalization = "0.1"

phi-ai = { path = "crates/phi-ai" }
phi-ai-auth = { path = "crates/phi-ai-auth" }
phi-ai-types = { path = "crates/phi-ai-types" }
phi-host = { path = "crates/phi-host" }
phi-session = { path = "crates/phi-session" }
phi-tui = { path = "crates/phi-tui" }

# Code standard (DESIGN.md, locked): no unwrap/expect/panic in library
# crates. Tests opt out per-file with #![allow(...)].
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
incremental = true
