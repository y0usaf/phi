[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
# Memory allocator (reduces fragmentation for long-running processes)
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = "0.6"
tikv-jemalloc-sys = "0.6"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
async-trait = "0.1.88"
base64 = "0.22.1"
bytes = "1"
clap = { version = "4.5.39", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
eventsource-stream = "0.2.3"
fd-lock = "4.0.4"
futures = "0.3.31"
ignore = "0.4"
jiff = "0.2.14"
libc = "0.2"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize", "error-send"] }
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.9.1"
regex-lite = "0.1.6"
reqwest = { version = "0.12.19", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal", "net"] }
tokio-util = "0.7.15"
toml = "0.8.22"
unicode-segmentation = "1.12"
unicode-width = "0.2"
image = "0.25"
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v7"] }
vt100 = "0.16"
dirs = "5"
webbrowser = "1.0.4"

phi-ai = { path = "crates/phi-ai" }
phi-builtins = { path = "crates/phi-builtins" }
phi-memory = { path = "crates/phi-memory" }
rusqlite = { version = "0.32", features = ["bundled"] }
phi-cli = { path = "crates/phi-cli" }
phi-ext = { path = "crates/phi-ext" }
phi-repl = { path = "crates/phi-repl" }
phi-mux = { path = "crates/phi-mux" }
phi-rlm = { path = "crates/phi-rlm" }
phi-lm-core = { path = "crates/phi-lm-core" }
phi-llm-parse = { path = "crates/phi-llm-parse" }
phi-rlm-prompts = { path = "crates/phi-rlm-prompts" }
phi-rlm-config = { path = "crates/phi-rlm-config" }
phi-rlm-engine = { path = "crates/phi-rlm-engine" }
phi-rlm-session = { path = "crates/phi-rlm-session" }
phi-provider = { path = "crates/phi-provider" }
phi-mux-clipboard = { path = "crates/phi-mux-clipboard" }
phi-mux-status = { path = "crates/phi-mux-status" }
phi-mux-persisted = { path = "crates/phi-mux-persisted" }
phi-mux-keys = { path = "crates/phi-mux-keys" }
phi-mux-grid = { path = "crates/phi-mux-grid" }
phi-mux-driver = { path = "crates/phi-mux-driver" }
phi-mux-workspace = { path = "crates/phi-mux-workspace" }
phi-session = { path = "crates/phi-session" }
phi-session-tui = { path = "crates/phi-session-tui" }
phi-runtime = { path = "crates/phi-runtime" }
phi-tui = { path = "crates/phi-tui" }
phi-lua = { path = "crates/phi-lua" }
phi-harness = { path = "crates/phi-harness" }

[profile.dev]
debug = 0
incremental = true

[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3

[profile.test]
debug = 0
incremental = true
codegen-units = 256

[profile.test.package.syntect]
opt-level = 3

[profile.test.package.base64]
opt-level = 3

[profile.release]
opt-level = 1
codegen-units = 256
incremental = true

[profile.release-lto]
inherits = "release"
opt-level = 3
codegen-units = 16
incremental = false
lto = "thin"
