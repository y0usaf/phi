[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
base64 = "0.22.1"
bytes = "1"
clap = { version = "4.5.39", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
directories = "6.0.0"
eventsource-stream = "0.2.3"
fd-lock = "4.0.4"
futures = "0.3.31"
jiff = "0.2.14"
libc = "0.2"
mlua = { version = "0.11", features = ["lua54", "vendored", "error-send", "send"] }
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.9.1"
regex-lite = "0.1.6"
reqwest = { version = "0.12.19", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
# Trimmed from `default-fancy`: precompiled syntax/theme dumps only, no
# plist/yaml loaders (phi never loads .tmTheme/.sublime-syntax from disk).
syntect = { version = "5.2", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal", "net"] }
tokio-util = "0.7.15"
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v7", "v4", "v5"] }
vt100 = "0.16"
flate2 = "1"

phi-agent = { path = "crates/phi-agent" }
phi-ai = { path = "crates/phi-ai" }
phi-ai-auth = { path = "crates/phi-ai-auth" }
phi-ai-types = { path = "crates/phi-ai-types" }
phi-grid = { path = "crates/phi-grid" }
phi-host = { path = "crates/phi-host" }
phi-session = { path = "crates/phi-session" }
phi-tui = { path = "crates/phi-tui" }

[profile.dev]
debug = 0
incremental = true

[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3

[profile.test]
debug = 0
incremental = true
codegen-units = 256

[profile.test.package.syntect]
opt-level = 3

[profile.test.package.base64]
opt-level = 3

[profile.release]
opt-level = 1
codegen-units = 256
incremental = true

[profile.release-lto]
inherits = "release"
opt-level = 3
codegen-units = 16
incremental = false
lto = "thin"

[workspace.lints.rust]
dead_code = "warn"
unused = "warn"
unreachable_code = "warn"
unreachable_patterns = "warn"
